<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Registry · HoofMate</title>
  <style>
    body { background: #f5f1e7; color: #26362d; font: 1rem system-ui, sans-serif; margin: 0; }
    main { max-width: 56rem; margin: auto; padding: 2rem 1rem; }
    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    h1 { font: bold clamp(2.2rem, 7vw, 4rem) Georgia, serif; margin: .5rem 0 1.5rem; }
    section { background: #fffdf8; padding: 1.25rem; border: 1px solid #ddd6c9; border-radius: .75rem; margin-bottom: 1rem; }
    h2 { font: bold 1.5rem Georgia, serif; margin-top: 0; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: .75rem; align-items: end; }
    label { display: grid; gap: .25rem; }
    input, select, button { font: inherit; border-radius: .35rem; padding: .55rem; border: 1px solid #817c70; min-width: 0; }
    button { background: #365842; color: white; cursor: pointer; justify-self: start; }
    a { color: #365842; }
    li { padding: .6rem 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header><strong>HoofMate</strong><a href="/mock/">Horse dashboard demo</a></header>
    <h1>Animal registry</h1>
    <section>
      <h2>Add an animal</h2>
      <form id="animal-form">
        <label>Species <select name="species" required></select></label>
        <label>Name <input name="name" maxlength="100"></label>
        <label>Tag or ID <input name="identification" maxlength="100"></label>
        <label>Breed <input name="breed" maxlength="100"></label>
        <button disabled>Add animal</button>
      </form>
      <p id="status" role="status">Loading registry…</p>
    </section>
    <section>
      <h2>Registered animals</h2>
      <label>Filter by species <select id="filter"><option value="">All species</option></select></label>
      <p id="empty" hidden>No animals to show.</p>
      <ul id="animals"></ul>
    </section>
  </main>
  <script type="module" src="/registry/client.js"></script>
</body>
</html>
