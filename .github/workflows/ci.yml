name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-site:
    name: Validate current static prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required prototype files
        run: |
          test -f mock/index.html
          test -f mock/styles.css
          test -f mock/app.js

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test application and validate build
        run: |
          npm test
          npm run build
